[project]
name = "datascienceagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matthew Reda", email = "m.reda94@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=23.2.0",
    "anthropic>=0.7.0",
    "arviz>=0.16.0",
    "black>=23.10.0",
    "chromadb>=1.2.0",
    "fastapi>=0.104.0",
    "httpx>=0.25.0",
    "jupyter>=1.0.0",
    "loguru>=0.7.0",
    "matplotlib>=3.8.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mypy>=1.6.0",
    "numpy>=1.24.0",
    "openai>=1.3.0",
    "pandas>=2.1.0",
    "plotly>=5.17.0",
    "polars>=0.19.0",
    "prometheus-client>=0.18.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "pydantic-ai>=0.0.1",
    "pymc>=5.10.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "redis>=5.0.0",
    "ruff>=0.1.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "seaborn>=0.13.0",
    "sqlalchemy>=2.0.0",
    "statsmodels>=0.14.0",
    "torch>=2.9.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.0.1",
]
